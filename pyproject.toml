[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dayforce-task"
version = "0.1.0"
description = "Dayforce job test task"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34",
    "python-dotenv>=1.2",
    "pandas>=3.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
