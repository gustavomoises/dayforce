[project]
name = "incident-triage-api"
version = "0.1.0"
description = "Incident triage API: hybrid search and grounded LLM assistance"
readme = "README.md"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: calls the running API (needs API_BASE_URL)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
